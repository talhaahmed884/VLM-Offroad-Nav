services:
  vlm_nav:
    build: .
    container_name: vlm_offroad_env
    volumes:
      - ./src:/app/src 
      - ./data/RELLIS-3D:/app/data/RELLIS-3D
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1

